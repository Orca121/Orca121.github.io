<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Patrick Wong</title>
    <meta name="description" content="Patrick Wong 的个人主页。">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <meta property="og:title" content="Patrick Wong">
    <meta property="og:description" content="Patrick Wong">
    <meta property="og:type" content="website">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="ground" aria-hidden="true">
      <div class="ground-photo"></div>
      <div class="ground-photo"></div>
    </div>
    <div class="page">
      <header class="mast">
        <div class="lang">
          <button
            type="button"
            class="lang-button"
            aria-haspopup="listbox"
            aria-expanded="false"
            aria-controls="lang-list"
            aria-label="语言"
          >
            <span class="lang-value">简体中文</span>
            <span class="caret" aria-hidden="true"></span>
          </button>
          <ul id="lang-list" class="lang-list" role="listbox" aria-label="语言" hidden>
            <li id="opt-zh-CN" role="option" data-lang="zh-CN" lang="zh-CN" aria-selected="true">简体中文</li>
            <li id="opt-zh-HK" role="option" data-lang="zh-HK" lang="zh-HK" aria-selected="false">繁體中文</li>
            <li id="opt-en" role="option" data-lang="en" lang="en" aria-selected="false">English</li>
          </ul>
        </div>
      </header>
      <main>
        <h1>Patrick Wong</h1>
        <p class="intro" data-i18n="intro">活着，爱着，赴宴去。</p>
      </main>
      <footer class="colophon">
        <a class="credit" href="https://commons.wikimedia.org/wiki/File:Killerwhales_jumping.jpg">照片：Robert Pittman / NOAA</a>
      </footer>
    </div>
    <script src="site.js"></script>
  </body>
</html>
