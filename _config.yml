title: Patrick Wong
timezone: Etc/UTC
future: true
markdown: kramdown
kramdown:
  input: GFM

collections:
  briefings:
    output: true
    permalink: /briefings/:name/
  writings:
    output: true
    permalink: /writings/:name/

defaults:
  - scope:
      type: briefings
    values:
      layout: page
      section: briefings
  - scope:
      type: writings
    values:
      layout: page
      section: writings

exclude:
  - vendor
  - Gemfile
  - Gemfile.lock
  - README.md

giscus:
  repo: Orca121/Orca121.github.io
  repo_id: R_kgDOV-KpAw
  category: ""
  category_id: ""
  mapping: pathname
  strict: "1"
  reactions_enabled: "1"
  emit_metadata: "0"
  input_position: bottom
  theme: preferred_color_scheme
